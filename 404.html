<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Page not found · الصفحة غير موجودة</title>
  <meta name="theme-color" content="#0B132B">
  <!--
    This page is shown by GitHub Pages for ANY wrong address, at any folder depth, so it
    cannot rely on relative links to style.css or the fonts. It is therefore self-contained:
    same glass look, both themes, both languages, static gradient first — and it then TRIES
    to load the living background and the texts from the site (progressive enhancement).
  -->
  <style>
    :root { --text-scale: 1; }
    html[data-theme="dark"] {
      color-scheme: dark; --bg: #0B132B; --text: #FBF3E8; --muted: #A9B7CC; --heading: #F4D6B0;
      --accent: #D97706; --accent-2: #E68A1A; --on-accent: #0B132B; --focus: #5BC0DE;
      --glass: rgba(11, 18, 42, .62); --border: rgba(244, 214, 176, .28); --chip: rgba(255, 255, 255, .08);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 20px 44px -20px rgba(0, 0, 0, .6);
      --static-bg:
        linear-gradient(118deg, rgba(158, 70, 6, 0) 8%, rgba(158, 70, 6, .62) 30%, rgba(158, 70, 6, 0) 54%),
        linear-gradient(205deg, rgba(23, 41, 102, .95) 0%, rgba(23, 41, 102, 0) 58%),
        linear-gradient(18deg, rgba(158, 70, 6, .5) 0%, rgba(158, 70, 6, 0) 38%),
        linear-gradient(160deg, #0B132B 0%, #060a1c 55%, #172966 100%);
      --dot: rgba(0, 0, 0, .22);
    }
    html[data-theme="light"] {
      color-scheme: light; --bg: #F7F5FB; --text: #1B2145; --muted: #4A5275; --heading: #1B2145;
      --accent: #6D5BD0; --accent-2: #8470E0; --on-accent: #fff; --focus: #3B2F85;
      --glass: rgba(255, 255, 255, .6); --border: rgba(255, 255, 255, .95); --chip: rgba(255, 255, 255, .6);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, .85), 0 20px 44px -22px rgba(90, 80, 160, .38);
      --static-bg:
        linear-gradient(120deg, rgba(153, 201, 242, 0) 5%, rgba(153, 201, 242, .9) 32%, rgba(153, 201, 242, 0) 60%),
        linear-gradient(210deg, rgba(189, 173, 239, .7) 0%, rgba(189, 173, 239, 0) 36%),
        linear-gradient(25deg, rgba(143, 219, 179, .6) 0%, rgba(143, 219, 179, 0) 26%),
        linear-gradient(160deg, #F7F5FB 0%, #EAF2FB 60%, #F7F5FB 100%);
      --dot: rgba(70, 70, 130, .10);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); font-size: calc(clamp(16px, 15px + 0.21vw, 18px) * var(--text-scale)); }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px;
      color: var(--text); line-height: 1.7;
      font-family: "Atkinson Hyperlegible", "Tajawal", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, Arial, sans-serif;
    }
    #bg-fallback, #bg-canvas, #bg-dots { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #bg-fallback { z-index: -3; background: var(--static-bg); }
    #bg-canvas { z-index: -2; display: block; }
    .bg-static #bg-canvas { display: none; }
    #bg-dots { z-index: -1; background-image: radial-gradient(circle at .5px .5px, var(--dot) .5px, transparent .85px); background-size: 2px 2px; }
    .card {
      width: min(520px, 100%); padding: 28px 24px; border-radius: 26px; text-align: center; display: grid; gap: 14px; justify-items: center;
      background: var(--glass); border: 1px solid var(--border); box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%);
    }
    .mark {
      width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; font-size: 34px; font-weight: 700; line-height: 1;
      color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    h1 { margin: 0; font-size: 1.7rem; line-height: 1.4; color: var(--heading); }
    p { margin: 0; color: var(--muted); }
    .code { font-weight: 700; letter-spacing: .12em; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 999px;
      font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; color: var(--text); background: var(--chip); border: 1px solid var(--border);
    }
    .btn-primary { color: var(--on-accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    @media (prefers-reduced-motion: no-preference) { .card { animation: in .5s ease both; } }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="bg-fallback" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="bg-dots" aria-hidden="true"></div>

  <main class="card">
    <span class="mark" aria-hidden="true">م</span>
    <p class="code" dir="ltr">404</p>
    <h1 id="t-title">Page not found</h1>
    <p id="t-text">This link does not lead anywhere. The files are all on the home page.</p>
    <div class="row">
      <a class="btn btn-primary" id="home" href="/"><span id="t-home">Go to the home page</span></a>
      <button class="btn" type="button" id="lang">العربية</button>
      <button class="btn" type="button" id="theme" aria-label="Theme">◐</button>
    </div>
  </main>

  <script>
    (function () {
      'use strict';
      var root = document.documentElement;
      var TEXT = {
        en: { title: 'Page not found', text: 'This link does not lead anywhere. The files are all on the home page.', home: 'Go to the home page', other: 'العربية', theme: 'Switch dark / light' },
        ar: { title: 'الصفحة غير موجودة', text: 'هذا الرابط لا يؤدي إلى شيء. كل الملفات في الصفحة الرئيسية.', home: 'اذهب إلى الصفحة الرئيسية', other: 'English', theme: 'التبديل بين الداكن والفاتح' }
      };
      // The same safe-storage rule as the main site (boot.js), repeated here because this
      // page cannot count on loading boot.js: everything in try/catch, never throws.
      function read(key) { try { var v = window.localStorage.getItem('lnh:' + key); return v === null ? null : JSON.parse(v); } catch (e) { return null; } }
      function write(key, value) { try { window.localStorage.setItem('lnh:' + key, JSON.stringify(value)); } catch (e) { /* blocked: fine */ } }
      function mq(q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } }

      var lang = read('lang');
      if (lang !== 'ar' && lang !== 'en') lang = String(navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
      var theme = read('theme');
      if (theme !== 'dark' && theme !== 'light') theme = mq('(prefers-color-scheme: light)') ? 'light' : 'dark';
      var listeners = { theme: [], sweep: [], reading: [] };

      function paint() {
        var s = TEXT[lang];
        root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        root.setAttribute('data-theme', theme);
        document.getElementById('t-title').textContent = s.title;
        document.getElementById('t-text').textContent = s.text;
        document.getElementById('t-home').textContent = s.home;
        document.getElementById('lang').textContent = s.other;
        document.getElementById('theme').setAttribute('aria-label', s.theme);
        document.title = s.title + ' · 404';
      }
      function fire(name, data) { for (var i = 0; i < listeners[name].length; i++) { try { listeners[name][i](data); } catch (e) { /* ignore */ } } }

      // Where is the site? On GitHub project pages it lives in /REPO/, otherwise at /.
      var seg = location.pathname.split('/').filter(Boolean)[0] || '';
      var bases = [];
      if (/\.github\.io$/i.test(location.hostname) && seg && !/\./.test(seg)) bases.push('/' + seg + '/');
      bases.push('/');
      document.getElementById('home').href = bases[0];

      paint();
      if (mq('(prefers-reduced-motion: reduce)') || read('reading') === true) root.classList.add('reading', 'bg-static');

      document.getElementById('lang').addEventListener('click', function () { lang = lang === 'ar' ? 'en' : 'ar'; write('lang', lang); paint(); fire('sweep'); });
      document.getElementById('theme').addEventListener('click', function () { theme = theme === 'dark' ? 'light' : 'dark'; write('theme', theme); paint(); fire('theme', theme); fire('sweep'); });

      // Progressive enhancement: texts from translations.js and the living background, if reachable.
      var app = {
        get theme() { return theme; },
        on: function (name, fn) { if (listeners[name]) listeners[name].push(fn); return function () {}; },
        emit: fire,
        sweep: function () { fire('sweep'); }
      };
      function tryBase(i) {
        if (i >= bases.length) { root.classList.add('bg-static'); return; }
        var base = bases[i];
        import(base + 'translations.js').then(function (m) {
          ['en', 'ar'].forEach(function (l) {
            var d = m.translations && m.translations[l];
            if (!d) return;
            if (d['nf.title']) TEXT[l].title = d['nf.title'];
            if (d['nf.text']) TEXT[l].text = d['nf.text'];
            if (d['nf.home']) TEXT[l].home = d['nf.home'];
          });
          document.getElementById('home').href = base;
          paint();
          return import(base + 'modules/living-background.js');
        }).then(function (bg) {
          if (bg && bg.init) bg.init(app);
        }).catch(function () { tryBase(i + 1); });
      }
      try { tryBase(0); } catch (e) { root.classList.add('bg-static'); }
    })();
  </script>
</body>
</html>
