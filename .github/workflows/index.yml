# Rebuilds files-index.json and publishes the site.
#
# What happens on every push (for example when you upload a file into /files):
#   1. scripts/build-index.mjs rebuilds files-index.json (the list the site reads).
#   2. If the list changed, the bot commits it back with "[skip ci]".
#      (Commits made with the built-in GITHUB_TOKEN never start another workflow run,
#       and files-index.json is ignored by the trigger below, so there is no loop.)
#   3. The site is published to GitHub Pages with the fresh list inside.
#
# One-time setup (see README): Settings -> Pages -> Source: "GitHub Actions",
# and Settings -> Actions -> General -> Workflow permissions: "Read and write".

name: Build file index and publish

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'files-index.json'
  workflow_dispatch:

permissions:
  contents: write   # to commit files-index.json
  pages: write      # to publish the site
  id-token: write   # required by the Pages deploy action

concurrency:
  group: build-index-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repo (full history, for file dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build files-index.json
        run: node scripts/build-index.mjs

      - name: Commit the index if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files-index.json
          if git diff --cached --quiet; then
            echo "Index unchanged."
          else
            git commit -m "Update files index [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Could not push the index (it is still published below)."
          fi

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
